<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h2 {
      color: #333;
    }
    input {
      padding: 5px;
      font-size: 14px;
    }
    button {
      padding: 5px 10px;
      font-size: 14px;
      margin-left: 5px;
      cursor: pointer;
    }
    ul {
      margin-top: 15px;
    }
    li {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <h2>Yang Perlu Dikerjakan<p>Jangan Lupa Dikerjakan!!!</p></h2>

  <input type="text" id="todoInput" placeholder="Jangan cuma ditulis...">
  <button onclick="addTodo()">Add+</button>

  <ul id="todoList">
    <!-- daftar tugas muncul di sini -->
  </ul>

  <script>
    function addTodo() {
      // Ambil input
      let input = document.getElementById("todoInput");
      let task = input.value.trim();

      if (task !== "") {
        // Buat elemen li
        let li = document.createElement("li");
        li.textContent = task;

        // Tambahkan ke ul
        document.getElementById("todoList").appendChild(li);

        // Kosongkan input
        input.value = "";
      } else {
        alert("Tugas tidak boleh kosong!");
      }
    }
  </script>
</body>
</html>
